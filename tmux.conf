# =============================================================================
# ~/.config/tmux/tmux.conf
# Self-contained gruvbox-hard cockpit for AI agents, TUIs and nvim.
# No TPM, no remote plugins; in-tree local plugins live under plugins/.
# Mirrors ~/.config/nvim (gruvbox hard, palette + keys).
#
#   reload:  C-a r
#   literal C-a to the app:  C-a C-a
#
# Never bind Alt-* on the root table: it would swallow the nvim <A-*> maps.
# =============================================================================

# --- Prefix ------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Terminal / keys ---------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:extkeys"
set -s extended-keys on
set -s set-clipboard on
set -g escape-time 10

# default-shell is inherited from the server environment ($SHELL -> zsh). tmux
# does not expand "$SHELL" inside this file and a literal value fails
# ("not a suitable shell"), so we rely on the inherited value on purpose.

# --- General behaviour -------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on
set -g mouse on
setw -g mode-keys vi

# New windows/panes open in the current pane's directory.
bind c new-window -c "#{pane_current_path}"

# --- Keybindings (all under C-a; no Alt-* on the root table) -----------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind %
unbind '"'

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind z resize-pane -Z
bind x kill-pane
bind Space next-layout
bind n next-window
bind p previous-window
bind , command-prompt -I "#W" "rename-window -- '%%'"
bind $ command-prompt -I "#S" "rename-session -- '%%'"
bind d detach-client
bind [ copy-mode
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config recarregada!"

# --- Copy-mode (vi) + Wayland clipboard --------------------------------------
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# --- Status bar (mirror of the nvim statusline, flat blocks, no powerline) ----
set -g status-position bottom
set -g status-interval 1
set -g status-style "bg=#3c3836,fg=#ebdbb2"

set -g status-left-length 30
set -g status-left "#[bg=#b8bb26,fg=#282828,bold] #S #[bg=#3c3836,fg=#a89984] "

set -g status-right-length 60
set -g status-right "#[fg=#a89984] %H:%M "

set -g window-status-separator ""
set -g window-status-format "#[bg=#3c3836,fg=#a89984] #I:#W "
set -g window-status-current-format "#[bg=#fabd2f,fg=#282828,bold] #I:#W "

# --- Pane borders and titles -------------------------------------------------
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#a89984,bold],#[fg=#7c6f64]} #{?#{==:#{pane_title},},#{pane_current_command},#{pane_title}} #[default]"
set -g pane-border-style "fg=#7c6f64"
set -g pane-active-border-style "fg=#a89984"
set -g automatic-rename on
set -g allow-rename on

# --- Local plugins (in-tree; no TPM, never fetches code) ----------------------
# Each plugins/*.tmux registers its own binds/options. Adding a plugin = adding
# a file; the loader globs them. See AGENTS.md → Local plugins.
source-file ~/.config/tmux/plugins/*.tmux
